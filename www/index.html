<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Meu Treino</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
/* Layout: app de uma coluna (máx. 560px), barra inferior fixa, folhas (sheets) que sobem de baixo */
:root{
 --bg:#0b0c0f; --s1:#14161b; --s2:#1c1f26; --s3:#252932; --line:#2a2e37;
 --txt:#f2f3f5; --mut:#8a909b; --dim:#5d636e;
 --acc:#ff5a36; --acc2:#ff8a5c; --ok:#34d399; --okbg:#0f2a20; --warn:#fbbf24; --info:#7cb4ff;
 --disp:Barlow,"Arial Narrow",system-ui,sans-serif; --ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --r:16px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
body.inwk{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;color:var(--txt)}
a{color:var(--info)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.disp{font-family:var(--disp);letter-spacing:.01em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .small{font-size:12.5px}
.hidden{display:none!important}

/* top */
.top{padding:calc(18px + env(safe-area-inset-top)) 0 8px}
.top h1{font-family:var(--disp);font-weight:800;font-size:38px;line-height:.95;margin:6px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hello{display:flex;justify-content:space-between;align-items:center}
.quote{margin:10px 0 0;font-size:14px;line-height:1.45;color:#c9cdd4;font-style:italic;border-left:3px solid var(--acc);padding-left:10px;text-wrap:pretty}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:17px;color:var(--acc)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 4px}
.day{background:var(--s1);border-radius:12px;padding:8px 0 9px;text-align:center;border:1px solid transparent}
.day .d{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase}
.day .n{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1}
.day .m{height:16px;font-size:10px;font-weight:800;margin-top:2px}
.day.today{border-color:var(--line);background:var(--s2)}
.day.done .m{color:var(--ok)} .day .m.run{color:var(--info)}

/* hero */
.hero{margin-top:14px;border-radius:22px;padding:18px;background:linear-gradient(160deg,#2a1610 0%,#16171c 55%);border:1px solid #3a2219;position:relative;overflow:hidden}
.hero .big{font-family:var(--disp);font-weight:800;font-size:64px;line-height:.85;color:var(--acc)}
.hero .ttl{font-family:var(--disp);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;background:#ffffff10;color:#d6d9de;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:#2a2110;color:var(--warn)} .chip.acc{background:#ff5a3622;color:var(--acc2)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:16px;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;letter-spacing:.01em;box-shadow:0 8px 24px #ff5a3640}
.cta:active{transform:scale(.985)}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;background:var(--s2);font-weight:700}
.btn2.danger{color:#ff8b8b}
.alt{margin-top:10px;width:100%;text-align:center;font-size:13px;font-weight:600;color:var(--mut);padding:6px}

/* sections */
.sec{margin-top:22px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sech h3{margin:0;font-size:15px;font-weight:800}
.panel{background:var(--s1);border-radius:var(--r);padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s1);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--disp);font-weight:800;font-size:28px;line-height:1}
.stat span{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.prog{height:6px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:4px}
.phase-row{display:flex;justify-content:space-between;align-items:center}
.queue{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.q{background:var(--s2);border-radius:10px;padding:9px 0;text-align:center;font-family:var(--disp);font-weight:800;font-size:20px;border:1px solid transparent}
.q small{display:block;font-family:var(--ui);font-size:9.5px;font-weight:700;color:var(--mut);margin-top:1px;text-transform:uppercase}
.q.next{border-color:var(--acc);color:var(--acc)} .q.done{color:var(--ok)}
.tip{display:flex;gap:10px;align-items:flex-start;background:#241d0e;border-radius:14px;padding:12px;font-size:13px;color:#f7d68a;margin-top:12px}
.tip.ok{background:var(--okbg);color:#a7f0cf}
.tip svg{flex:0 0 18px;margin-top:1px}

/* workout */
.wkbar{position:sticky;top:0;z-index:15;background:#0b0c0ff2;backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line)}
.wkbar .row{display:flex;align-items:center;gap:10px}
.wkbar .t{flex:1;min-width:0}
.wkbar .t b{display:block;font-family:var(--disp);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.wkbar .clock{font-size:12px;color:var(--mut);font-weight:600}
.fin{background:var(--ok);color:#06251a;font-weight:800;padding:9px 14px;border-radius:10px;font-size:14px}
.ibtn{width:38px;height:38px;border-radius:10px;background:var(--s2);display:grid;place-items:center}
.wprog{height:3px;background:var(--s3);margin-top:10px;border-radius:2px;overflow:hidden}
.wprog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.ex{background:var(--s1);border-radius:var(--r);margin-top:12px;overflow:hidden}
.ex.alldone{box-shadow:inset 0 0 0 1px #1f5a42}
.exh{display:flex;gap:12px;padding:12px 12px 8px}
.thumb{width:78px;height:62px;border-radius:10px;background:#fff center/cover no-repeat;flex:0 0 auto;position:relative}
.thumb.none{background:var(--s2);display:grid;place-items:center;color:var(--dim)}
.thumb .play{position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:50%;background:#000a;display:grid;place-items:center}
.exn{flex:1;min-width:0}
.exn b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.exn .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.exn .meta strong{color:var(--txt);font-weight:700}
.exn .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--s3);color:var(--mut);letter-spacing:.03em;text-transform:uppercase}
.tag.bi{background:#2a2110;color:var(--warn)} .tag.sw{background:#16243a;color:var(--info)} .tag.up{background:var(--okbg);color:var(--ok)} .tag.core{background:var(--okbg);color:var(--ok)}
.more{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:0 0 auto}
.exnote{font-size:12.5px;color:var(--mut);padding:0 12px 8px}
.st{display:grid;grid-template-columns:34px 1fr 64px 64px 44px;gap:6px;align-items:center;padding:4px 12px}
.st.h{font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--dim);padding-top:4px;padding-bottom:2px}
.st.h span{text-align:center}
.st .sn{font-family:var(--disp);font-weight:700;font-size:17px;text-align:center;color:var(--mut)}
.st .prev{font-size:12.5px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st input{width:100%;height:40px;background:var(--s2);border:1px solid transparent;border-radius:9px;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.st input::-webkit-outer-spin-button,.st input::-webkit-inner-spin-button{-webkit-appearance:none}
.st input::placeholder{color:#474c55;font-weight:600}
.st .ck{height:40px;border-radius:9px;background:var(--s2);display:grid;place-items:center;color:var(--dim)}
.st.done{background:#0f2a2055}
.st.done input{background:transparent;color:var(--ok)}
.st.done .ck{background:var(--ok);color:#06251a}
.st.done .sn{color:var(--ok)}
.st.pr .sn::after{content:"PR";display:block;font-family:var(--ui);font-size:8.5px;font-weight:800;color:var(--warn)}
.exf{display:flex;gap:8px;padding:8px 12px 12px}
.exf button{font-size:12.5px;font-weight:700;color:var(--mut);background:var(--s2);border-radius:8px;padding:7px 10px}
.bilink{display:flex;align-items:center;gap:8px;margin:8px 4px -4px;font-size:11px;font-weight:800;color:var(--warn);letter-spacing:.06em}
.bilink::before,.bilink::after{content:"";flex:1;height:1px;background:#4a3a1c}
.secttl{display:flex;align-items:center;gap:8px;margin:24px 0 2px;font-family:var(--disp);font-weight:800;font-size:18px;text-transform:uppercase}
.secttl i{width:8px;height:8px;border-radius:2px;background:var(--acc)}
.secttl.core i{background:var(--ok)}
.warmrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.warmrow::-webkit-scrollbar{display:none}
.wc{flex:0 0 124px;background:var(--s1);border-radius:14px;padding:8px;text-align:left;border:1px solid transparent}
.wc .thumb{width:100%;height:68px;margin-bottom:7px}
.wc b{font-size:12.5px;display:block;line-height:1.2}
.wc span{font-size:11.5px;color:var(--mut)}
.wc.done{border-color:#1f5a42}
.wc.done b::before{content:"✓ ";color:var(--ok)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0e1014f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:9px 0 10px;font-size:10.5px;font-weight:700;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--txt)} nav.tabs button.on svg{color:var(--acc)}
nav.tabs .live{position:relative}
nav.tabs .live::after{content:"";position:absolute;top:6px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* rest timer pill + sheet */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:30;display:none;align-items:center;gap:10px;background:var(--s3);border:1px solid #3a404b;border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 12px 30px #000a;width:min(420px,calc(100% - 32px))}
#rest.show{display:flex}
#rest .rt{font-family:var(--disp);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:62px}
#rest .rb{flex:1;height:5px;background:#3a404b;border-radius:3px;overflow:hidden}
#rest .rb i{display:block;height:100%;background:var(--acc)}
#rest .pb{background:#ffffff14;border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px}
#rest.end{border-color:var(--ok)} #rest.end .rt{color:var(--ok)} #rest.end .rb i{background:var(--ok)}
.ring{display:grid;place-items:center;margin:8px auto 6px;width:220px;height:220px;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .v{font-family:var(--disp);font-weight:800;font-size:64px;font-variant-numeric:tabular-nums}
.adj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex;animation:fade .15s ease}
.sheet{background:var(--s1);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 12px}
.sheet h2{font-family:var(--disp);font-weight:800;font-size:26px;text-transform:uppercase;margin:0;line-height:1}
.gap{height:10px}
.bigimg{width:100%;max-width:100%;aspect-ratio:3/2;border-radius:14px;background:#fff center/contain no-repeat;margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;background:var(--s2);margin-top:8px}
.opt .thumb{width:62px;height:48px}
.opt b{font-size:14px;font-weight:700}
.opt.cur{box-shadow:inset 0 0 0 1px var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:10px;padding:3px;margin-top:12px}
.seg button{padding:8px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--txt)}
.menuitem{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:600;text-align:left}
.menuitem:last-child{border:0}
.menuitem svg{color:var(--mut)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-220%);visibility:hidden;z-index:60;background:var(--s3);border:1px solid #3a404b;color:var(--txt);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 12px 30px #000a;transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px)}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#toast.pr{border-color:var(--warn);color:var(--warn)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v2.1 */
.st.wu .sn{color:var(--warn);font-size:12px;font-family:var(--ui);font-weight:800}
.st.wu.done{background:#2a211033}
.st.wu.done .ck{background:var(--warn);color:#2a2110}
.st.wu.done input{color:var(--warn)}
.st .sn small{display:block;font-family:var(--ui);font-size:8.5px;font-weight:800;color:var(--info)}
.rirrow{display:flex;gap:6px;align-items:center;padding:2px 12px 8px 52px;font-size:11.5px;color:var(--mut);font-weight:700}
.rirrow button{flex:1;padding:7px 0;border-radius:8px;background:var(--s2);font-weight:800;font-size:13px;color:var(--txt)}
.rirrow button.on{background:var(--info);color:#0b1a2e}
.mynote{margin:0 12px 8px;padding:8px 10px;border-radius:9px;background:#16243a;color:#bcd6ff;font-size:12.5px;display:flex;gap:8px}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;min-height:120px;margin:14px 0 6px}
.plates .bar{width:44px;height:10px;background:#9aa0aa;border-radius:2px}
.plates .sleeve{width:16px;height:16px;background:#c4c8cf;border-radius:2px}
.pl{border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg)}
.plist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kgin{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:8px;margin-top:12px}
.kgin input{width:100%;min-width:0;-moz-appearance:textfield;text-align:center;font-family:var(--disp);font-weight:800;font-size:34px;background:var(--s2);border:0;border-radius:12px;padding:8px}
.kgin input::-webkit-outer-spin-button,.kgin input::-webkit-inner-spin-button{-webkit-appearance:none}
.kgin button{width:52px;height:56px;border-radius:12px;background:var(--s2);font-weight:800;font-size:20px}
.painbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.painbtns button{padding:12px 0;border-radius:10px;background:var(--s2);font-family:var(--disp);font-weight:800;font-size:20px}
.mbar{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.mbar .tr{height:12px;background:var(--s2);border-radius:6px;position:relative;overflow:hidden}
.mbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acc)}
.mbar .tr i.ok{background:var(--ok)} .mbar .tr i.lo{background:#4b5260}
.mbar .tr b{position:absolute;top:0;bottom:0;border-left:1px dashed #6b7280;border-right:1px dashed #6b7280;background:#ffffff08}
.mbar span:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{font-size:10px;font-weight:800;color:var(--dim);text-align:center;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:9px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--mut);position:relative}
.cal .c.o{background:transparent}
.cal .c.t{box-shadow:inset 0 0 0 1px var(--mut);color:var(--txt)}
.cal .c.w{background:#ff5a3624;color:var(--txt)}
.cal .c.w b{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--acc);line-height:1}
.cal .c .r{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--info)}
.calnav{display:flex;align-items:center;justify-content:space-between}
.calnav b{font-weight:800;text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.mchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:700;color:var(--mut)}
.mchips button.on{background:var(--txt);color:var(--bg)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid label{font-size:12px;font-weight:700;color:var(--mut)}
.formgrid input{margin-top:5px}
textarea.field{min-height:110px;resize:vertical;font:inherit}
/* ---------- como fazer ---------- */
.how{margin:12px 0 14px}
.how h4{margin:16px 0 6px;font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.09em;text-transform:uppercase}
.how p{margin:0;line-height:1.5}
.how ol,.how ul{margin:0;padding-left:20px;line-height:1.5}
.how li{margin:4px 0}
.how ol li::marker{color:var(--acc);font-weight:800}
.howx{margin-top:8px!important;color:#bcd6ff;font-size:13.5px}

Suitcase carry (mais pesado)","suitcase carry",null],["Suitcase carry pesado","suitcase carry",null],["Caminhada do fazendeiro","farmer walk","Farmers_Walk"],["Caminhada do garçom (halter acima da cabeça)","waiter walk",null]]}, HOWDB={"how":{"Gato-camelo":{"p":"Quatro apoios: mãos abaixo dos ombros, joelhos abaixo do quadril.","e":["Arredonde as costas devagar, levando o queixo ao peito.","Volte e estenda suavemente, olhando um pouco à frente.","Movimento lento, sem forçar o fim da amplitude."],"r":"Solte o ar ao arredondar, puxe ao estender.","x":["Ir rápido ou forçar até doer.","Mexer só o pescoço."],"c":"É mobilidade, não alongamento: amplitude confortável. Ótimo para preparar os discos."},"Bird dog":{"p":"Quatro apoios, coluna neutra, abdômen levemente contraído.","e":["Estenda um braço à frente e a perna oposta para trás, até a linha do corpo.","Segure de 5 a 10 segundos sem deixar o quadril girar.","Volte devagar e troque o lado."],"r":"Respiração normal durante a sustentação.","x":["Levantar a perna acima do quadril e arquear a lombar.","Girar o quadril para o lado da perna."],"c":"Imagine um copo d'água nas costas: ele não pode cair. É um dos exercícios mais seguros para a lombar."},"Ponte de glúteo":{"p":"Deitado de barriga para cima, joelhos dobrados, pés no chão na largura do quadril.","e":["Contraia os glúteos e suba o quadril até alinhar joelhos, quadril e ombros.","Segure 1 a 2 segundos no topo.","Desça devagar, sem encostar totalmente."],"r":"Solte o ar ao subir.","x":["Subir arqueando a lombar em vez de contrair o glúteo.","Empurrar com a ponta dos pés."],"c":"Costelas para baixo no topo: a força vem do glúteo, não das costas."},"Prancha lateral":{"p":"De lado, cotovelo abaixo do ombro, pernas estendidas e pés sobrepostos (ou joelhos dobrados na versão mais fácil).","e":["Levante o quadril até o corpo formar uma linha reta.","Mantenha a posição pelo tempo indicado.","Troque de lado."],"r":"Respire normalmente, sem prender o ar.","x":["Deixar o quadril cair ou ir para trás.","Ombro afundando, longe do cotovelo."],"c":"Trabalha o quadrado lombar e oblíquos, estabilizadores importantes da coluna."},"Curl-up de McGill":{"p":"Deitado, uma perna dobrada e a outra estendida, mãos sob a lombar para manter a curvatura natural.","e":["Contraia o abdômen e tire levemente a cabeça e os ombros do chão, como um bloco.","Segure 10 segundos.","Desça e repita; troque a perna dobrada na metade das repetições."],"r":"Respire curto durante a sustentação, sem prender o ar.","x":["Fazer abdominal completo, dobrando a coluna.","Puxar a cabeça com as mãos."],"c":"Não é para enrolar a coluna: o movimento é mínimo. Treina o abdômen sem flexionar a lombar."},"Dead bug":{"p":"Deitado, braços estendidos para o teto, quadril e joelhos a 90°.","e":["Encoste a lombar no chão e mantenha assim.","Estenda um braço para trás e a perna oposta à frente, devagar.","Volte e alterne os lados."],"r":"Solte o ar ao estender braço e perna.","x":["Lombar desgrudando do chão.","Movimento rápido e sem controle."],"c":"Se a lombar sair do chão, diminua a amplitude da perna."},"Prancha frontal":{"p":"Apoio nos antebraços e pontas dos pés, cotovelos abaixo dos ombros.","e":["Corpo em linha reta da cabeça aos calcanhares.","Contraia abdômen e glúteos.","Mantenha pelo tempo indicado."],"r":"Respire normalmente.","x":["Quadril alto ou caído.","Olhar para frente, tensionando o pescoço."],"c":"Quadril caído joga a carga na lombar. Prefira menos tempo com a posição perfeita."},"Prancha RKC":{"p":"Prancha nos antebraços, cotovelos um pouco à frente dos ombros, pés juntos.","e":["Contraia ao máximo glúteos, abdômen e coxas.","Puxe os cotovelos em direção aos pés, sem sair do lugar.","Segure por pouco tempo (10 a 20 s), com tensão total."],"r":"Respiração curta e controlada.","x":["Relaxar o glúteo.","Fazer por tempo longo e perder a tensão."],"c":"Versão curta e intensa da prancha, segura para a coluna se o quadril ficar alinhado."},"Prancha com toque no ombro":{"p":"Prancha alta, mãos abaixo dos ombros, pés um pouco afastados.","e":["Tire uma mão e toque o ombro oposto.","Volte e alterne.","O quadril não pode balançar."],"r":"Solte o ar a cada toque.","x":["Girar o quadril a cada toque.","Pés juntos demais, perdendo estabilidade."],"c":"Treina antirrotação. Quanto mais afastados os pés, mais fácil."},"Prancha com arrasto":{"p":"Prancha alta, um halter ou anilha ao lado do corpo, no chão.","e":["Com a mão oposta, passe por baixo do corpo e arraste o peso para o outro lado.","Volte à prancha e repita com a outra mão.","Quadril parado o tempo todo."],"r":"Solte o ar ao arrastar.","x":["Quadril subindo ou girando.","Peso pesado demais."],"c":"O desafio é não girar o tronco."},"Prancha lateral com alcance":{"p":"Prancha lateral com o braço de cima estendido para o teto.","e":["Passe o braço de cima por baixo do tronco, girando levemente os ombros.","Volte ao teto.","O quadril fica alto e parado."],"r":"Solte o ar ao passar o braço por baixo.","x":["Deixar o quadril cair durante o giro."],"c":"O giro é dos ombros e tórax, não da lombar."},"Prancha lateral com elevação de quadril":{"p":"Prancha lateral no antebraço.","e":["Desça o quadril até quase tocar o chão.","Suba acima da linha do corpo contraindo o oblíquo.","Repita e troque o lado."],"r":"Solte o ar ao subir.","x":["Fazer rápido, sem controle."],"c":"Amplitude curta e controlada."},"Rollout com roda":{"p":"Ajoelhado em um colchonete, mãos na roda abaixo dos ombros.","e":["Contraia abdômen e glúteos e role a roda à frente devagar.","Vá só até onde a lombar não arqueia.","Volte puxando com o abdômen."],"r":"Puxe o ar na volta, solte ao ir.","x":["Lombar afundando no fim do movimento.","Voltar puxando com o quadril."],"c":"Comece com amplitude curta. É exigente: se sentir a lombar, pare."},"Stir the pot":{"p":"Prancha com os antebraços sobre uma bola suíça, pés afastados.","e":["Faça pequenos círculos com os antebraços, como mexendo uma panela.","Faça as voltas indicadas em um sentido e depois no outro.","Corpo rígido o tempo todo."],"r":"Respiração curta e contínua.","x":["Círculos grandes demais.","Quadril alto."],"c":"Exercício do método McGill: estabilidade sem movimento da coluna."},"Pallof press":{"p":"De lado para a polia, cabo na altura do peito, mãos juntas no centro do peito, pés na largura do quadril.","e":["Empurre as mãos à frente até estender os braços.","Segure 1 a 2 segundos sem deixar o tronco girar.","Volte e repita; depois troque o lado."],"r":"Solte o ar ao empurrar.","x":["Girar em direção à polia.","Carga alta demais, obrigando a inclinar."],"c":"Antirrotação: o abdômen trabalha para manter a coluna parada. Ótimo para a lombar."},"Caminhada do fazendeiro":{"p":"Um halter ou kettlebell pesado em cada mão, em pé, ombros para trás.","e":["Caminhe com passos curtos e firmes pela distância indicada.","Tronco ereto, abdômen firme.","Coloque os pesos no chão agachando, não curvando."],"r":"Respire normalmente.","x":["Ombros caídos para a frente.","Pegar os pesos do chão com a coluna curvada."],"c":"Pegue e solte os pesos com a técnica do agachamento."},"Suitcase carry":{"p":"Um halter ou kettlebell em uma mão só, ao lado do corpo.","e":["Caminhe a distância indicada mantendo o tronco totalmente reto.","Não incline para o lado do peso.","Troque de mão e repita."],"r":"Respire normalmente.","x":["Inclinar o tronco para o lado do peso.","Encolher o ombro."],"c":"Um dos melhores exercícios para os estabilizadores laterais da coluna."},"Caminhada do garçom":{"p":"Um halter estendido acima da cabeça, braço travado, punho reto.","e":["Caminhe a distância indicada com o braço vertical.","Costelas para baixo, abdômen firme.","Troque de braço."],"r":"Respire normalmente.","x":["Arquear a lombar para segurar o peso.","Braço inclinando à frente."],"c":"Se a lombar arquear, use um peso menor."},"Elevação de joelhos na paralela":{"p":"Apoio nos antebraços na cadeira de paralelas (capitão), costas encostadas.","e":["Suba os joelhos em direção ao peito, contraindo o abdômen.","Desça devagar até quase estender.","Sem balanço."],"r":"Solte o ar ao subir.","x":["Balançar as pernas.","Desgrudar as costas do encosto."],"c":"Mantenha as costas apoiadas; se incomodar a lombar, suba só até 90°."},"Supino inclinado no Smith":{"p":"Banco inclinado a 30–45° sob a barra do Smith. A barra deve descer na parte alta do peito.","e":["Escápulas juntas e para baixo, pés firmes no chão.","Destrave a barra e desça até tocar levemente a parte alta do peito.","Empurre para cima sem travar totalmente os cotovelos."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Cotovelos abertos a 90° (forçam o ombro): mantenha uns 45–60°.","Tirar o quadril do banco."],"c":"Glúteos no banco e leve arco natural; sem exagerar o arco lombar."},"Supino inclinado com barra":{"p":"Banco inclinado a 30–45°, barra no suporte, pegada um pouco mais aberta que os ombros.","e":["Escápulas juntas e para baixo, pés firmes.","Tire a barra e desça controlando até a parte alta do peito.","Empurre para cima e um pouco para trás."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Quicar a barra no peito.","Cotovelos totalmente abertos."],"c":"Peça ajuda (parceiro) nas séries pesadas. Glúteos no banco."},"Supino inclinado com halteres":{"p":"Banco inclinado a 30–45°, um halter em cada mão sobre o peito.","e":["Desça os halteres até a linha do peito, cotovelos a uns 45° do tronco.","Empurre para cima aproximando os halteres no topo.","Controle a descida."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Descer demais e perder o controle no fundo.","Bater os halteres no topo."],"c":"Para subir e descer os halteres pesados, apoie-os nas coxas e use o impulso das pernas."},"Supino reto com barra":{"p":"Deitado no banco reto, olhos abaixo da barra, pegada um pouco mais aberta que os ombros.","e":["Escápulas juntas e para baixo, pés firmes no chão.","Desça a barra até a linha dos mamilos.","Empurre para cima e levemente em direção aos ombros."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Cotovelos a 90° do tronco.","Levantar o quadril do banco."],"c":"Use parceiro ou travas de segurança nas séries pesadas."},"Supino reto com halteres":{"p":"Banco reto, um halter em cada mão acima do peito, palmas para frente.","e":["Desça até os halteres ficarem na linha do peito.","Empurre para cima aproximando-os no topo.","Controle sempre a descida."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Abrir demais os cotovelos.","Perder o controle no fundo."],"c":"Suba e desça os halteres apoiando nas coxas para proteger a lombar."},"Supino na máquina":{"p":"Ajuste o banco para que as pegadas fiquem na altura do meio do peito.","e":["Costas apoiadas, escápulas para trás.","Empurre até quase estender os braços.","Volte devagar até sentir o peito alongar."],"r":"Solte o ar ao empurrar.","x":["Banco muito baixo ou alto.","Deixar o peso bater na volta."],"c":"Opção segura em dias de lombar sensível."},"Voador":{"p":"Sentado no voador (peck deck), banco ajustado para os braços ficarem na altura do peito.","e":["Costas apoiadas, cotovelos levemente dobrados.","Feche os braços à frente contraindo o peito.","Volte devagar até sentir o alongamento."],"r":"Solte o ar ao fechar.","x":["Ir rápido na volta.","Ombros subindo em direção às orelhas."],"c":"Mantenha as costas no encosto."},"Crossover na polia alta":{"p":"Entre as duas polias altas, um pé à frente do outro, tronco levemente inclinado.","e":["Cotovelos levemente dobrados e fixos.","Traga as mãos para baixo e à frente, cruzando na altura do quadril.","Volte devagar até a linha dos ombros."],"r":"Solte o ar ao fechar.","x":["Dobrar e esticar os cotovelos (vira supino).","Carga que obriga a balançar o tronco."],"c":"Base em afundo, abdômen firme."},"Crossover na polia baixa":{"p":"Polias na altura baixa, um pé à frente, cabos nas mãos.","e":["Traga as mãos de baixo para cima até a altura do peito.","Contraia a parte alta do peito.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Usar impulso do corpo."],"c":"Abdômen firme para não arquear."},"Crucifixo inclinado com halteres":{"p":"Banco inclinado a 30°, halteres acima do peito, palmas uma para a outra.","e":["Com os cotovelos levemente dobrados, abra os braços em arco.","Desça até sentir o peito alongar, sem passar muito da linha do ombro.","Volte pelo mesmo arco."],"r":"Puxe o ar ao abrir, solte ao fechar.","x":["Carga alta que vira supino.","Descer demais e forçar o ombro."],"c":""},"Crucifixo reto com halteres":{"p":"Banco reto, halteres acima do peito, palmas uma para a outra.","e":["Cotovelos levemente dobrados, abra em arco.","Desça até a linha do peito.","Feche pelo mesmo caminho."],"r":"Puxe o ar ao abrir, solte ao fechar.","x":["Esticar totalmente os cotovelos.","Peso excessivo."],"c":""},"Puxada alta frontal":{"p":"Sentado no pulley, coxas presas sob o apoio, pegada aberta na barra.","e":["Peito alto e leve inclinação para trás.","Puxe a barra até a parte alta do peito, levando os cotovelos para baixo e para trás.","Volte controlando até estender os braços."],"r":"Solte o ar ao puxar.","x":["Puxar atrás da nuca.","Balançar o tronco para ajudar."],"c":"Inclinação pequena; nada de jogar o corpo para trás."},"Puxada alta no triângulo":{"p":"Pulley com o puxador em triângulo (pegada neutra, mãos próximas).","e":["Peito alto, leve inclinação para trás.","Puxe até o triângulo chegar perto do peito.","Volte devagar estendendo os braços."],"r":"Solte o ar ao puxar.","x":["Puxar com os bíceps, sem levar os cotovelos para baixo."],"c":""},"Puxada unilateral no cabo":{"p":"Ajoelhado ou sentado de frente para a polia alta, pegador em uma mão.","e":["Puxe o cotovelo para baixo, junto ao corpo.","Contraia a lateral das costas.","Volte estendendo o braço."],"r":"Solte o ar ao puxar.","x":["Girar o tronco para ajudar."],"c":"Tronco parado."},"Barra fixa":{"p":"Pendurado na barra, pegada um pouco mais aberta que os ombros (ou use o graviton para ajudar).","e":["Desça as escápulas antes de puxar.","Puxe até o queixo passar a barra, levando o peito em direção a ela.","Desça controlando até quase estender os braços."],"r":"Solte o ar ao subir.","x":["Balançar as pernas (kipping).","Meia repetição."],"c":"Ao descer da barra, não pule: desça com cuidado para não impactar a coluna."},"Pulldown com braço estendido":{"p":"Em pé de frente para a polia alta, barra reta ou corda, braços quase estendidos.","e":["Incline um pouco o tronco à frente, coluna neutra.","Leve a barra até as coxas com os braços quase retos.","Volte devagar até a altura dos olhos."],"r":"Solte o ar ao descer a barra.","x":["Dobrar os cotovelos.","Arredondar as costas."],"c":""},"Pullover com halter":{"p":"Deitado no banco, um halter seguro com as duas mãos acima do peito.","e":["Com os cotovelos levemente dobrados, leve o halter para trás da cabeça.","Desça até sentir o alongamento das costas.","Volte à posição inicial."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Arquear a lombar ao descer."],"c":"Mantenha as costelas para baixo e não exagere na amplitude."},"Remada baixa no triângulo":{"p":"Sentado na remada baixa, pés apoiados, joelhos levemente dobrados, triângulo nas mãos.","e":["Tronco ereto, peito alto.","Puxe o triângulo até o abdômen, juntando as escápulas.","Volte estendendo os braços sem arredondar as costas."],"r":"Solte o ar ao puxar.","x":["Balançar o tronco para frente e para trás.","Arredondar a lombar na volta."],"c":"Coluna neutra e abdômen firme do início ao fim. Se sentir dor lombar ou na perna, pare e reduza a carga."},"Remada articulada":{"p":"Peito apoiado na almofada da máquina, pegadas na altura dos ombros.","e":["Puxe as pegadas trazendo os cotovelos para trás.","Junte as escápulas no final.","Volte devagar."],"r":"Solte o ar ao puxar.","x":["Tirar o peito do apoio.","Encolher os ombros."],"c":"O apoio no peito tira a carga da lombar: ótima opção para você."},"Remada alta na máquina":{"p":"Sentado na máquina com o peito apoiado, pegada aberta acima da linha dos ombros.","e":["Puxe os cotovelos para baixo e para trás.","Junte as escápulas.","Volte devagar."],"r":"Solte o ar ao puxar.","x":["Usar impulso."],"c":"Peito sempre apoiado."},"Remada cavalinho apoiada":{"p":"Peito apoiado no banco da máquina (T-bar com apoio), pegadas nas mãos.","e":["Puxe trazendo os cotovelos para trás, junto ao corpo.","Junte as escápulas no topo.","Desça até estender os braços."],"r":"Solte o ar ao puxar.","x":["Desgrudar o peito do apoio para roubar."],"c":"O apoio no peito protege a lombar."},"Remada curvada com barra":{"p":"Em pé, barra nas mãos, joelhos levemente dobrados, quadril para trás, tronco a uns 45°.","e":["Trave o abdômen e mantenha a coluna neutra.","Puxe a barra até a linha do umbigo.","Desça controlando sem mudar a inclinação do tronco."],"r":"Puxe o ar antes de puxar e segure; solte no fim.","x":["Arredondar as costas.","Levantar o tronco a cada repetição."],"c":"É o exercício que mais exige da lombar no treino A. Carga moderada e técnica perfeita; se cansar a lombar, troque pela remada apoiada."},"Remada unilateral":{"p":"Uma mão e o joelho do mesmo lado apoiados no banco, outra mão com o halter, costas paralelas ao chão.","e":["Puxe o halter em direção ao quadril.","Leve o cotovelo para trás, junto ao corpo.","Desça até estender o braço."],"r":"Solte o ar ao puxar.","x":["Girar o tronco para subir o peso.","Puxar para o peito em vez do quadril."],"c":"O apoio no banco protege a coluna; mantenha-a reta."},"Remada baixa unilateral no cabo":{"p":"Sentado ou em pé de frente para a polia, pegador em uma mão.","e":["Puxe o cotovelo para trás, junto ao corpo.","Junte a escápula no final.","Volte estendendo o braço."],"r":"Solte o ar ao puxar.","x":["Girar o tronco."],"c":"Tronco parado e ereto."},"Desenvolvimento com halteres":{"p":"Sentado no banco com encosto vertical, halteres na altura dos ombros, palmas à frente.","e":["Costas no encosto, abdômen firme.","Empurre os halteres para cima até quase estender os braços.","Desça até a altura das orelhas."],"r":"Solte o ar ao subir.","x":["Arquear a lombar para empurrar.","Descer pouco demais."],"c":"Encosto vertical e costelas para baixo: não arqueie a lombar."},"Desenvolvimento na máquina":{"p":"Sentado na máquina, pegadas na altura dos ombros, costas no encosto.","e":["Empurre para cima até quase estender.","Desça devagar até a altura das orelhas.","Sem travar os cotovelos no topo."],"r":"Solte o ar ao subir.","x":["Tirar as costas do encosto."],"c":"Boa opção para dias de lombar sensível."},"Desenvolvimento articulado":{"p":"Sentado na máquina articulada, pegadas na altura dos ombros.","e":["Empurre para cima.","Desça controlando.","Costas sempre apoiadas."],"r":"Solte o ar ao subir.","x":["Arquear a lombar."],"c":""},"Desenvolvimento Arnold":{"p":"Sentado com encosto, halteres à frente do rosto, palmas viradas para você.","e":["Ao subir, gire os punhos até as palmas ficarem para frente.","Estenda os braços acima da cabeça.","Desça fazendo o giro inverso."],"r":"Solte o ar ao subir.","x":["Fazer rápido, sem controle do giro.","Arquear as costas."],"c":"Use encosto e abdômen firme."},"Elevação lateral com halteres":{"p":"Em pé, halteres ao lado do corpo, cotovelos levemente dobrados.","e":["Eleve os braços para os lados até a altura dos ombros.","Lidere o movimento com os cotovelos.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Balançar o corpo para subir.","Subir acima dos ombros encolhendo o trapézio."],"c":"Se precisar balançar o tronco, a carga está alta."},"Elevação lateral no cabo":{"p":"Em pé de lado para a polia baixa, pegador na mão do lado oposto à polia.","e":["Eleve o braço para o lado até a altura do ombro.","Cotovelo levemente dobrado.","Desça devagar, mantendo a tensão."],"r":"Solte o ar ao subir.","x":["Inclinar o tronco para longe da polia."],"c":""},"Elevação frontal no cabo":{"p":"De costas para a polia baixa, cabo passando entre as pernas, pegada à frente das coxas.","e":["Eleve os braços à frente até a altura dos ombros.","Cotovelos levemente dobrados.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Balançar o tronco.","Subir acima dos ombros."],"c":""},"Elevação frontal com halteres":{"p":"Em pé, halteres à frente das coxas.","e":["Eleve à frente até a altura dos ombros, alternando ou juntos.","Desça controlando."],"r":"Solte o ar ao subir.","x":["Usar impulso do quadril."],"c":"Abdômen firme para não arquear."},"Elevação frontal com anilha":{"p":"Em pé, anilha segura pelas laterais à frente das coxas.","e":["Eleve a anilha à frente até a altura dos olhos.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Inclinar o tronco para trás."],"c":"Abdômen firme."},"Voador inverso":{"p":"Sentado de frente para o encosto do voador, pegadas na altura dos ombros.","e":["Abra os braços para trás com os cotovelos levemente dobrados.","Contraia a parte de trás dos ombros.","Volte devagar."],"r":"Solte o ar ao abrir.","x":["Encolher os ombros.","Usar impulso."],"c":"Peito apoiado no encosto."},"Face pull":{"p":"Polia na altura dos olhos ou acima, corda nas mãos, um passo atrás.","e":["Puxe a corda em direção à testa, abrindo as mãos.","Cotovelos altos, na linha dos ombros.","Volte devagar."],"r":"Solte o ar ao puxar.","x":["Puxar para o peito com os cotovelos baixos.","Inclinar o tronco para trás."],"c":"Ótimo para a postura dos ombros."},"Crucifixo inverso no banco inclinado":{"p":"Deitado de bruços em banco inclinado, halteres pendurados.","e":["Abra os braços para os lados com os cotovelos levemente dobrados.","Contraia a parte de trás dos ombros.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Levantar o peito do banco."],"c":"O apoio no peito protege a lombar."},"Crucifixo inverso no cabo":{"p":"Entre as polias altas, cabos cruzados (mão direita no cabo esquerdo e vice-versa).","e":["Abra os braços para trás na altura dos ombros.","Contraia a parte de trás dos ombros.","Volte devagar."],"r":"Solte o ar ao abrir.","x":["Dobrar os cotovelos e puxar como remada."],"c":""},"Encolhimento no Smith":{"p":"Em pé, barra do Smith à frente das coxas, pegada na largura dos ombros.","e":["Suba os ombros em direção às orelhas.","Segure 1 segundo.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Girar os ombros.","Dobrar os cotovelos."],"c":"Tronco ereto, sem inclinar para frente."},"Encolhimento com halteres":{"p":"Em pé, halteres ao lado do corpo.","e":["Suba os ombros em direção às orelhas.","Segure 1 segundo.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Girar os ombros."],"c":""},"Encolhimento com barra":{"p":"Em pé, barra à frente das coxas.","e":["Suba os ombros.","Segure 1 segundo no topo.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Usar impulso das pernas."],"c":"Pegue a barra do suporte, não do chão."},"Rosca direta na polia":{"p":"Em pé de frente para a polia baixa, barra reta nas mãos, cotovelos junto ao corpo.","e":["Dobre os cotovelos levando a barra até o peito.","Cotovelos parados ao lado do tronco.","Desça até quase estender."],"r":"Solte o ar ao subir.","x":["Balançar o corpo.","Cotovelos indo para frente."],"c":"Joelhos levemente dobrados e abdômen firme."},"Rosca direta com barra W":{"p":"Em pé, barra W na pegada inclinada, cotovelos junto ao corpo.","e":["Suba a barra dobrando os cotovelos.","Contraia o bíceps no topo.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Jogar o quadril para ajudar."],"c":"Se precisar balançar, reduza a carga."},"Rosca alternada com halteres":{"p":"Em pé, halteres ao lado do corpo, palmas para dentro.","e":["Suba um halter girando a palma para cima.","Desça devagar e alterne.","Cotovelos parados."],"r":"Solte o ar ao subir.","x":["Balançar o tronco."],"c":""},"Rosca alternada no banco inclinado":{"p":"Sentado em banco inclinado a 45–60°, halteres pendurados, braços estendidos.","e":["Suba um halter mantendo o cotovelo apontado para baixo.","Desça até estender totalmente.","Alterne os braços."],"r":"Solte o ar ao subir.","x":["Levar o cotovelo à frente.","Tirar as costas do banco."],"c":"Costas apoiadas: protege a lombar."},"Rosca martelo":{"p":"Em pé, halteres ao lado do corpo, palmas viradas para dentro.","e":["Suba os halteres sem girar os punhos.","Desça devagar."],"r":"Solte o ar ao subir.","x":["Balançar o corpo."],"c":""},"Rosca Scott":{"p":"Sentado no banco Scott, axilas encostadas no apoio, barra W nas mãos.","e":["Suba a barra dobrando os cotovelos.","Desça devagar até quase estender.","Sem soltar o peso no fundo."],"r":"Solte o ar ao subir.","x":["Estender de vez no fundo (risco para o cotovelo)."],"c":""},"Tríceps pulley":{"p":"Em pé de frente para a polia alta, barra nas mãos, cotovelos junto ao corpo.","e":["Empurre a barra para baixo até estender os braços.","Cotovelos parados ao lado do tronco.","Volte até a altura do peito."],"r":"Solte o ar ao empurrar.","x":["Cotovelos abrindo ou subindo.","Inclinar o corpo sobre a barra."],"c":""},"Tríceps na corda":{"p":"Em pé de frente para a polia alta, corda nas mãos, cotovelos junto ao corpo.","e":["Empurre para baixo e afaste as pontas da corda no final.","Volte devagar."],"r":"Solte o ar ao empurrar.","x":["Mexer os ombros."],"c":""},"Tríceps francês na polia":{"p":"De costas para a polia, corda atrás da cabeça, tronco levemente inclinado à frente.","e":["Estenda os braços à frente e para cima.","Cotovelos apontando para frente, parados.","Volte devagar."],"r":"Solte o ar ao estender.","x":["Abrir os cotovelos.","Arquear a lombar."],"c":"Base em afundo e abdômen firme."},"Tríceps francês com halter":{"p":"Sentado com encosto, um halter seguro com as duas mãos acima da cabeça.","e":["Desça o halter atrás da cabeça dobrando os cotovelos.","Estenda de volta.","Cotovelos apontando para cima."],"r":"Solte o ar ao estender.","x":["Arquear as costas.","Abrir os cotovelos."],"c":"Faça sentado com encosto para proteger a lombar."},"Tríceps testa":{"p":"Deitado no banco, barra W acima do peito, braços estendidos.","e":["Desça a barra em direção à testa dobrando só os cotovelos.","Estenda de volta.","Cotovelos parados apontando para o teto."],"r":"Solte o ar ao estender.","x":["Abrir os cotovelos.","Mexer os ombros."],"c":""},"Mergulho no banco":{"p":"Mãos na borda de um banco atrás de você, pernas à frente.","e":["Desça dobrando os cotovelos até uns 90°.","Empurre de volta.","Corpo perto do banco."],"r":"Solte o ar ao subir.","x":["Descer demais e forçar o ombro."],"c":""},"Agachamento livre":{"p":"Barra apoiada no trapézio, pés na largura dos ombros, pontas levemente para fora.","e":["Puxe o ar e trave o abdômen (bracing) antes de descer.","Desça levando o quadril para trás e para baixo, joelhos na direção dos pés.","Desça até onde a lombar não arredonda e suba empurrando o chão."],"r":"Puxe o ar e segure na descida; solte no fim da subida.","x":["Arredondar a lombar no fundo.","Joelhos entrando para dentro.","Tirar os calcanhares do chão."],"c":"O exercício que mais carrega a coluna no plano. Profundidade só até onde a lombar fica neutra. Se sentir dor irradiada, troque por hack ou leg press."},"Hack squat":{"p":"Costas e ombros apoiados na máquina, pés no meio da plataforma na largura dos ombros.","e":["Destrave a máquina e desça dobrando os joelhos.","Desça até as coxas ficarem paralelas à plataforma ou um pouco abaixo.","Suba empurrando com o pé inteiro."],"r":"Puxe o ar na descida, solte ao subir.","x":["Lombar desgrudando do encosto no fundo.","Joelhos para dentro."],"c":"Ótima alternativa ao agachamento livre: o encosto reduz a carga na coluna."},"Agachamento no Smith":{"p":"Barra do Smith no trapézio, pés um pouco à frente da linha do corpo.","e":["Trave o abdômen.","Desça levando o quadril para baixo e para trás.","Suba empurrando o chão."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Pés muito para trás, jogando o peso nos joelhos."],"c":"A trajetória guiada ajuda a manter a coluna estável."},"Leg press 45°":{"p":"Costas e quadril bem apoiados, pés no meio da plataforma, na largura do quadril.","e":["Destrave e desça a plataforma dobrando os joelhos.","Desça até uns 90° ou até onde o quadril não sai do banco.","Empurre de volta sem travar os joelhos."],"r":"Puxe o ar ao descer, solte ao empurrar.","x":["Quadril desgrudando do banco no fundo (arredonda a lombar).","Travar os joelhos no topo."],"c":"Não desça além do ponto em que o quadril começa a sair do banco. Esse é o principal cuidado para a lombar."},"Agachamento goblet":{"p":"Halter ou kettlebell seguro junto ao peito, pés um pouco mais abertos que os ombros.","e":["Desça entre as pernas mantendo o peito alto.","Cotovelos por dentro dos joelhos no fundo.","Suba empurrando o chão."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Inclinar o tronco à frente.","Calcanhares saindo do chão."],"c":"Ótimo para aprender o agachamento com pouca carga na coluna."},"Agachamento búlgaro":{"p":"De costas para um banco, peito do pé de trás apoiado nele, pé da frente bem à frente.","e":["Desça o joelho de trás em direção ao chão.","Tronco levemente inclinado à frente.","Suba empurrando com o pé da frente."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Pé da frente muito perto do banco.","Joelho da frente entrando para dentro."],"c":"Exercício unilateral: menos carga total na coluna."},"Afundo reverso com halteres":{"p":"Em pé, halteres ao lado do corpo.","e":["Dê um passo para trás e desça até o joelho quase tocar o chão.","Volte à posição inicial empurrando com o pé da frente.","Alterne ou faça todas de um lado."],"r":"Puxe o ar ao descer, solte ao subir.","x":["Passo curto demais.","Tronco caindo à frente."],"c":"Tronco ereto."},"Afundo andando":{"p":"Em pé, halteres ao lado do corpo, espaço livre à frente.","e":["Dê um passo à frente e desça até o joelho de trás quase tocar o chão.","Suba e já avance com a outra perna.","Continue caminhando."],"r":"Solte o ar ao subir.","x":["Joelho da frente para dentro.","Passos curtos demais."],"c":"Tronco ereto e abdômen firme."},"Leg press unilateral":{"p":"Leg press com um pé no centro da plataforma, o outro apoiado no function fatigueMap(at){
 const now=at||Date.now(), F={}; Object.keys(RM).forEach(k=>F[k]=0);
 const add=(m,amt,t)=>{ const h=(now-t)/36e5; if(h<0||h>24*7) return; F[m]+=amt*Math.exp(-h/RM_TAU[m]); };
 const s=load();
 s.sessions.forEach(x=>{ const t=new Date(x.date).getTime(); x.sets.forEach(st=>{ const L=LOAD[GROUP_OF[st.ex]]; if(!L) return; const rirF=st.rir==null?1:st.rir>=4?.7:st.rir>=3?.85:1; Object.entries(L).forEach(([m,w])=>add(m,w*rirF,t)); }); });
 if(s.active){ Object.values(s.active.sets).forEach(st=>{ if(st.w) return; const L=LOAD[GROUP_OF[st.ex]]; if(L) Object.entries(L).forEach(([m,w])=>add(m,w,st.t)); }); }
 if(realRuns()){ (s.runs||[]).forEach(r=>{ const t=new Date(r.date).getTime(); let mlt=r.wt===3?1.35:1; if(r.hr) mlt*=Math.min(1.5,Math.max(.6,(r.hr-115)/35)); const k=r.km*mlt; add("quadriceps",k*.45,t); add("posterior",k*.35,t); add("gluteo",k*.3,t); add("panturrilha",k*.55,t); }); }
 else if(s.countRuns){ for(let d=0;d<7;d++){ const day=new Date(); day.setHours(7,30,0,0); day.setDate(day.getDate()-d); const L=RUN_LOAD[day.getDay()]; if(L&&day.getTime()<=now&&!(s.skipRuns||[]).includes(localISO(day))) Object.entries(L).forEach(([m,v])=>add(m,v,day.getTime())); } }
 return F;
}

function slots(A){

  const adj=adjMap[A.phase+"|"+A.key+"|"+i]||0; if(adj) cur.s=Math.max(1,cur.s+adj);

 for(let jj=j-1;jj>=0;jj--){ const d=A.sets[o.i+"#"+jj]; if(!d) continue; if(!(d.kg>0)) return {kg:d.kg,reps:Math.min(hi,Math.max(lo,d.reps)),live:true};
  if(d.rir==null) return {kg:d.kg,reps:Math.min(hi,Math.max(lo,d.reps)),live:true};
  const e1=d.kg*(1+(d.reps+d.rir)/30); let tgt=Math.min(hi,Math.max(lo,d.reps)); if(d.reps>=hi&&d.rir>tR) tgt=Math.max(lo,hi-2); else if(d.rir<tR-1) tgt=Math.max(lo,Math.min(hi,d.reps-1)); let kg=roundTo(e1/(1+(tgt+tR)/30),st);
  kg=Math.min(Math.max(kg,roundTo(d.kg*.85,st)),roundTo(d.kg*1.1,st)||d.kg); return {kg,reps:tgt,live:true}; }
 const last=lastFor(e.n); if(!last) return null; const pv=last.sets[j]||last.sets[last.sets.length-1];
 const allTop=last.sets.length>=o.base.s && last.sets.every(x=>x.reps>=hi && (x.rir==null||x.rir>=1));
 if(allTop&&pv.kg>0) return {kg:pv.kg+st,reps:lo,live:false};

}

function progressOf(A){ const SL=liveSlots(A), total=SL.reduce((a,o)=>a+setsFor(o.ex),0); let d=0; SL.forEach(o=>{ for(let j=0;j<setsFor(o.ex);j++){ const k=o.i+"#"+j; if(A.sets[k]||(A.skip||{})[k]) d++; } }); return {total,done:d}; }
function curPointer(A){ let p=fPtr(A); if(p&&p.warm){ const nx=nextAfter(A,-1); p=nx?{o:nx,j:remJ(A,nx)[0],n:setsFor(nx.ex)}:null; } return p?Object.assign(p,{SL:slots(A)}):null; }

/* ---------- treino express ---------- */
function restMin(d){ return d==="—"?0.15:restSecOf(d)/60; }
function expressPlan(ph,k,budget){
 const W=workout(ph,k), S=load(), base=[...W.main.map(e=>({e,core:false})),...W.core.map(e=>({e,core:true}))];
 const it=base.map((o,i)=>{ const sw=S.swaps[ph+"|"+k+"|"+i]; const n=sw||o.e.n; const adj=(S.setAdj||{})[ph+"|"+k+"|"+i]||0; return {i,n,s:Math.max(1,o.e.s+adj),d:o.e.d,core:o.core,comp:COMPOUND.has(GROUP_OF[o.e.n])||GROUP_OF[o.e.n]==="Puxada vertical"}; });
 const est=()=>4+it.reduce((a,x)=>a+(x.s>0?x.s*(0.75+restMin(x.d)):0),0);
 const steps=[
  ()=>it.forEach(x=>{ x.d={"2 min":"90 s","90 s":"60 s","75 s":"60 s","60 s":"45 s","45 s":"30 s"}[x.d]||x.d; }),
  ()=>{ const iso=it.filter(x=>!x.core&&!x.comp&&x.s>0); for(let a=0;a+1<iso.length;a+=2) iso[a].d="—"; const c=it.filter(x=>x.core&&x.s>0); if(c.length>1) c[0].d="—"; },
  ()=>it.filter(x=>!x.core&&!x.comp).forEach(x=>x.s=Math.min(x.s,2)),
  ()=>{ const c=it.filter(x=>x.core); c.forEach((x,ix)=>{ x.s=ix===0?2:0; if(ix===0) x.d="30 s"; }); },
  ()=>it.filter(x=>x.comp).forEach(x=>x.s=Math.min(x.s,2)),
 ];
 for(const f of steps){ if(est()<=budget) break; f(); }
 const mains=()=>it.filter(x=>!x.core&&x.s>0);
 while(est()>budget && mains().length>3){ const iso=it.filter(x=>!x.core&&!x.comp&&x.s>0); const v=(iso.length?iso:mains()).pop(); v.s=0; }
 const ovr={}; it.forEach(x=>ovr[x.i]={s:x.s,d:x.d}); return {ovr,min:Math.round(est()),sets:it.reduce((a,x)=>a+x.s,0)};
}

  <div class="exopts">${[20,25,30,35].map(m=>{ const pl=expressPlan(ph,k,m); return `<button data-x="${m}"><b>${m} min</b><span>${pl.sets} séries • ~${pl.min} min</span></button>`; }).join("")}</div>
  <p class="small mut" style="margin:12px 0 0">Treino completo: ${full.sets} séries, cerca de ${full.min} min.</p>`);
 sheet.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ const pl=expressPlan(ph,k,+b.dataset.x); closeSheet(); startWorkout(k,{ovr:pl.ovr,express:+b.dataset.x}); toast(`Treino express: ${pl.sets} séries, ~${pl.min} min`); });

/* ---------- próximo ciclo ---------- */
function planNextCycle(){
 const s=load(), st=new Set(stagnant()), swaps=Object.assign({},s.swaps), adj={}, changes=[];
 const weeks=Math.max(1,Math.min(12,weekNum())), cs=s.sessions.filter(x=>new Date(x.date)>=parseISO(s.start)), avg={};
 cs.forEach(x=>x.sets.forEach(y=>{ const m=muscleOf(y.ex); if(m) avg[m]=(avg[m]||0)+1/weeks; }));
 const count=n=>s.sessions.reduce((a,x)=>a+(x.sets.some(y=>y.ex===n)?1:0),0);
 [1,2,3].forEach(ph=>KEYS.forEach(k=>{ const W=workout(ph,k); W.main.forEach((e,i)=>{ const key=ph+"|"+k+"|"+i, cur=swaps[key]||e.n;
   if(st.has(cur)){ const g=GROUP_OF[e.n], alts=(SUBS[g]||[]).map(x=>x[0]).filter((n,ix,a)=>a.indexOf(n)===ix&&n!==cur&&!st.has(n)).sort((a,b)=>(EX[b].img?1:0)-(EX[a].img?1:0)||count(a)-count(b));
    if(alts.length){ swaps[key]=alts[0]===e.n?undefined:alts[0]; if(!swaps[key]) delete swaps[key]; changes.push(`Fase ${ph}, treino ${k}: ${cur} → ${alts[0]} (estagnado)`); } } }); }));
 if(cs.length>=8){ ["Peito","Costas","Ombros","Quadríceps","Posterior/glúteo"].forEach(m=>{ const v=avg[m]||0; if(v>=10&&v<=20) return; const dl=v<10?1:-1;
   [1,2,3].forEach(ph=>{ let done=false; KEYS.forEach(k=>{ if(done) return; workout(ph,k).main.forEach((e,i)=>{ if(done||MUSCLE[GROUP_OF[e.n]]!==m) return; const key=ph+"|"+k+"|"+i, ns=e.s+((s.setAdj||{})[key]||0)+dl; if(ns<2||ns>4) return; adj[key]=((s.setAdj||{})[key]||0)+dl; done=true; changes.push(`Fase ${ph}, treino ${k}: ${e.n} ${dl>0?"+1 série":"−1 série"} (${m.toLowerCase()} com média de ${Math.round(v)} séries/semana)`); }); }); }); }); }
 return {swaps,adj:Object.assign({},s.setAdj||{},adj),changes};
}
function cycleSheet(){ const pl=planNextCycle(), s=load();

  <p class="small mut" style="margin:8px 0 0">O app analisou seus treinos: troca os exercícios que pararam de progredir e ajusta o volume dos grupos que ficaram fora da faixa de 10 a 20 séries por semana. Seu histórico continua.</p>

let wakeLock=null;
async function wake(on){ try{ const KA=CAP&&CAP.Plugins&&CAP.Plugins.KeepAwake; if(KA){ if(on&&load().wake) await KA.keepAwake(); else await KA.allowSleep(); return; } if(on&&load().wake&&"wakeLock" in navigator){ wakeLock=await navigator.wakeLock.request("screen"); } else if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&load().active) wake(true); });
function startWorkout(k,opt){ opt=opt||{}; const s=load(), ph=phaseNum(), swap={};
 Object.entries(s.swaps).forEach(([key,v])=>{ const [p,kk,i]=key.split("|"); if(+p===ph&&kk===k) swap[+i]=v; });
 s.active={v:2,key:k,phase:ph,started:Date.now(),warm:[],sets:{},swap,ovr:opt.ovr||null,express:opt.express||null,skip:{},cur:"warm",view:"focus"}; s.active.plannedMin=modelMinutes(s.active,true); save(); wake(true); render(); window.scrollTo(0,0);
 if(NW){ NW.requestPermission().catch(()=>{}); nativeSync(); } }

 const nMain=W.main.length;
 let html=`<div class="wkbar"><div class="wrap"><div class="row"><button class="ibtn" id="wmenu" aria-label="Opções">${ic("dots",20)}</button>
  <div class="t"><b>Treino ${A.key}${A.express?` <span class="tag bi" style="vertical-align:3px">Express ${A.express}′</span>`:""}</b><span class="clock num" id="clock">0:00</span><span class="clock"> • ${done}/${total} séries</span></div>

  <div class="small mut" style="margin-top:4px">Toque para marcar como feito. Toque duas vezes para ver a execução.</div>`;

function warmRows(o,last){

  return `<div class="st wu ${d?"done":""}" data-k="${k}"><span class="sn">AQ${j+1}</span><span class="prev">${Math.round(pc*100)}% × ${r}</span>

function modelMinutes(A,full){ const SL=liveSlots(A); let m=(full||A.cur==="warm")?4:0;

function paceRatio(){ const r=load().sessions.filter(x=>x.plannedMin&&x.min>=10&&x.sets.length>=5).slice(-8).map(x=>x.min/x.plannedMin).sort((a,b)=>a-b);
 if(!r.length) return 1; const m=r[Math.floor(r.length/2)]; return Math.min(1.6,Math.max(.7,m)); }
function planMinutes(ph,k){ const S=load(), swap={}; Object.entries(S.swaps).forEach(([key,v])=>{ const [p,kk,i]=key.split("|"); if(+p===ph&&kk===k) swap[+i]=v; });
 const A={phase:ph,key:k,swap,sets:{},skip:{},cur:"warm"}; return Math.round(modelMinutes(A,true)*paceRatio()); }

 const end=new Date(Date.now()+mins*60000); return {mins:Math.max(0,Math.round(mins)),end,hh:end.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}; }

/* ---------- acelerar ---------- */
function compressRemaining(A,budget){ const ratio=paceRatio(), items=liveSlots(A).map(o=>({o,n:setsFor(o.ex),rem:remJ(A,o).length,d:o.ex.d,core:o.core,comp:COMPOUND.has(GROUP_OF[o.base.n])||GROUP_OF[o.base.n]==="Puxada vertical"})).filter(x=>x.rem>0);
 const ch=[]; const est=()=>((A.cur==="warm")?4:0)+items.reduce((a,x)=>a+x.rem*(0.75+restMin(x.d)),0)*ratio;
 const steps=[
  ()=>{ let c=0; items.forEach(x=>{ const nd={"2 min":"90 s","90 s":"60 s","75 s":"60 s","60 s":"45 s","45 s":"30 s"}[x.d]; if(nd){ x.d=nd; c++; } }); if(c) ch.push("Descansos encurtados (ex.: 90 s → 60 s)"); },
  ()=>{ const iso=items.filter(x=>!x.core&&!x.comp); for(let a=0;a+1<iso.length;a+=2){ if(iso[a].o.i+1===iso[a+1].o.i&&iso[a].d!=="—"){ iso[a].d="—"; ch.push(`Bi-set: ${iso[a].o.ex.n} + ${iso[a+1].o.ex.n}`); } } },
  ()=>items.filter(x=>!x.core&&!x.comp&&x.rem>1).forEach(x=>{ x.rem--; ch.push(`${x.o.ex.n}: uma série a menos`); }),
  ()=>{ const c=items.filter(x=>x.core&&x.o.i!==A.cur); (items.some(x=>x.core&&x.o.i===A.cur)?c:c.slice(1)).forEach(x=>{ if(x.rem){ x.rem=0; ch.push(`Fica de fora: ${x.o.ex.n}`); } }); },
  ()=>items.filter(x=>x.comp&&x.rem>1).forEach(x=>{ x.rem--; ch.push(`${x.o.ex.n}: uma série a menos`); }),
 ];
 for(const f of steps){ if(est()<=budget) break; f(); }
 while(est()>budget){ const v=[...items].reverse().find(x=>!x.core&&!x.comp&&x.rem>0&&x.o.i!==A.cur)||[...items].reverse().find(x=>!x.core&&x.rem>0&&x.o.i!==A.cur); if(!v||items.filter(x=>x.rem>0&&!x.core).length<=1) break; ch.push(`Fica de fora: ${v.o.ex.n}`); v.rem=0; }

let TM=null, tmInt=null;

function timedStart(key,cfg){ TM={key,cfg,phase:"count",t0:Date.now(),side:1,hold:1,over:[],ticked:0}; playSound("tick"); clearInterval(tmInt); tmInt=setInterval(timedTick,100); timedTick(); }
function timedTick(){ if(!TM) return; const now=Date.now(), c=TM.cfg; let label="", val="", over=false, frac=0;
 if(TM.phase==="count"){ const l=3-Math.floor((now-TM.t0)/1000); if(l<=0){ TM.phase="run"; TM.t0=now; TM.ticked=0; playSound("go"); haptic(60); } else { if(TM.ticked!==l){ TM.ticked=l; if(l<3){ playSound("tick"); } } val=String(l); label="Prepare-se"; frac=0; } }
 if(TM.phase==="run"){ const el=(now-TM.t0)/1000, left=Math.ceil(c.sec-el); if(left<=0){
   if(c.holds>1&&TM.hold<c.holds){ TM.phase="gap"; TM.t0=now; playSound("chime"); haptic([80]); }
   else { TM.phase="over"; TM.t0=now; playSound("chime"); haptic([200,100,200]); } }
  else { if(left<=3&&TM.ticked!==left){ TM.ticked=left; playSound("tick"); } val=fmtSec(left); frac=el/c.sec; label=c.holds>1?`Repetição ${TM.hold} de ${c.holds}`:c.sides===2?`Lado ${TM.side} de 2`:"Segure"; } }
 if(TM.phase==="gap"){ const l=Math.ceil(5-(now-TM.t0)/1000); if(l<=0){ TM.hold++; TM.phase="run"; TM.t0=now; TM.ticked=0; playSound("go"); } else { val=String(l); label=`Descanse • próxima ${TM.hold+1} de ${c.holds}`; frac=0; } }
 if(TM.phase==="over"){ const ex=Math.floor((now-TM.t0)/1000); val="+"+ex; over=true; frac=1; label=c.holds>1?"Todas as repetições feitas":c.sides===2&&TM.side===1?"Lado 1 concluído • tempo extra":"Tempo batido • tempo extra"; }
 const v=document.getElementById("tv"), lb=document.getElementById("tl"), rc=document.getElementById("tc"), br=document.getElementById("tbr");
 if(v){ v.firstChild.nodeValue=val; lb.textContent=label; rc.style.strokeDashoffset=(1-Math.min(1,frac))*628; br.classList.toggle("over",over); const act=document.getElementById("tact"); if(act&&act.dataset.ph!==TM.phase){ act.dataset.ph=TM.phase; renderTimedActions(); } }
}

 if(!TM){ el.innerHTML=`<button class="bigdone" id="tgo" style="background:var(--acc);color:#fff">${ic("play",18,0).replace('fill="none"','fill="#fff"')} Iniciar ${el.dataset.sec}</button>`; document.getElementById("tgo").onclick=()=>{ timedStart(el.dataset.key,JSON.parse(el.dataset.cfg)); renderTimedActions(); }; return; }

 el.innerHTML=`<div class="tmrow"><button class="btn2" id="tstop">Parar</button><button class="bigdone" id="tdone">${ic("check",20,2.6)} Concluir</button></div>`;

function setupCanvas(cv){ const r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight; cv.width=w*r; cv.height=h*r; const g=cv.getContext("2d"); g.scale(r,r); return [g,w,h]; }
function lineChart(cv,labels,series,dec,range){ const [g,w,h]=setupCanvas(cv), pl=34,pr=10,pt=10,pb=22, all=series.flatMap(s=>s.v); let mn=Math.min(...all),mx=Math.max(...all); if(range){ mn=range[0]; mx=range[1]; } else { if(mn===mx){mn-=dec?1:5;mx+=dec?1:5;} const pad=(mx-mn)*.15; mn=Math.max(0,mn-pad); mx+=pad; }
 const X=i=>pl+(labels.length===1?(w-pl-pr)/2:i*(w-pl-pr)/(labels.length-1)), Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
 g.font="600 10px Inter,system-ui"; g.fillStyle="#5d636e"; g.strokeStyle="#22262e"; g.lineWidth=1;
 for(let i=0;i<=3;i++){ const v=mn+(mx-mn)*i/3,y=Y(v); g.beginPath(); g.moveTo(pl,y); g.lineTo(w-pr,y); g.stroke(); g.fillText(dec?(Math.round(v*10)/10).toLocaleString("pt-BR"):Math.round(v),2,y+3); }
 const step=Math.ceil(labels.length/6); g.textAlign="center"; labels.forEach((l,i)=>{ if(i%step===0||i===labels.length-1) g.fillText(l,X(i),h-5); }); g.textAlign="left";
 series.forEach((s,si)=>{ if(si===0&&s.v.length>1){ const gr=g.createLinearGradient(0,pt,0,h-pb); gr.addColorStop(0,s.c+"44"); gr.addColorStop(1,s.c+"00"); g.fillStyle=gr; g.beginPath(); s.v.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.lineTo(X(s.v.length-1),h-pb); g.lineTo(X(0),h-pb); g.closePath(); g.fill(); }
  g.strokeStyle=s.c; g.lineWidth=2.5; g.lineJoin="round"; g.beginPath(); s.v.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.stroke();
  const li=s.v.length-1; g.fillStyle=s.c; g.beginPath(); g.arc(X(li),Y(s.v[li]),4.5,0,7); g.fill(); g.strokeStyle="#14161b"; g.lineWidth=2; g.stroke(); }); }
function barChart(cv,labels,vals,fmt){ const [g,w,h]=setupCanvas(cv), pb=22,pt=18, mx=Math.max(...vals)||1, bw=w/labels.length;
 g.font="600 10px Inter,system-ui"; g.textAlign="center";
 vals.forEach((v,i)=>{ const bh=Math.max(2,(h-pb-pt)*v/mx), x=i*bw+bw*.2, last=i===vals.length-1; g.fillStyle=last?"#ff5a36":"#2c313a"; const r=5; g.beginPath(); g.moveTo(x,h-pb); g.lineTo(x,h-pb-bh+r); g.quadraticCurveTo(x,h-pb-bh,x+r,h-pb-bh); g.lineTo(x+bw*.6-r,h-pb-bh); g.quadraticCurveTo(x+bw*.6,h-pb-bh,x+bw*.6,h-pb-bh+r); g.lineTo(x+bw*.6,h-pb); g.fill();
  g.fillStyle="#5d636e"; g.fillText(labels[i],x+bw*.3,h-5); if(last){ g.fillStyle="#f2f3f5"; g.fillText(fmt?fmt(v):(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"t",x+bw*.3,h-pb-bh-5); } }); }

 <div class="sec"><div class="panel"><button class="btn2 danger" id="rst">Reiniciar as 12 semanas</button><p class="small mut" style="margin:8px 0 0;text-align:center">Volta para a semana 1 a partir de hoje. O histórico é mantido.</p></div></div>
 <p class="small mut" style="text-align:center;margin:22px 0">Meu Treino 2.4 • Imagens: free-exercise-db (domínio público)</p></div>`;
 const sw=Object.entries(s.swaps); document.getElementById("swl").innerHTML=sw.length?sw.map(([k,v])=>{ const [p,kk,i]=k.split("|"); const base=[...workout(p,kk).main,...workout(p,kk).core][+i]; return `<div class="lrow"><div style="min-width:0"><b>${esc(v)}</b><div class="small mut">no lugar de ${esc(base.n)} • Fase ${p}, treino ${kk}</div></div><button class="ibtn" data-rm="${esc(k)}" aria-label="Remover">${ic("undo",16)}</button></div>`; }).join(""):`<p class="small mut" style="margin:0">Nenhuma. Ao trocar um exercício, escolha "Sempre neste treino" para fixar a troca.</p>`;

function importBackupFile(f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.sessions)) throw 0;
   const cur=load(); const txt=cur.sessions.length?`O arquivo tem ${d.sessions.length} treino${d.sessions.length===1?"":"s"}. Os dados atuais deste celular (${cur.sessions.length} treinos) serão substituídos.`:`O arquivo tem ${d.sessions.length} treino${d.sessions.length===1?"":"s"}${d.sessions.length?`, o último em ${fmtDay(localISO(d.sessions[d.sessions.length-1].date))}`:""}.`;
   ask("Importar backup?",txt,"Importar",()=>{ mem=Object.assign(load(),d); if(mem.active&&mem.active.v!==2) mem.active=null; mem.autoBackupErr=null; save(); render(); toast("Backup importado"); autoBackup(true); }); }catch(err){ toast("Esse arquivo não é um backup do Meu Treino"); } }; r.readAsText(f); }

 document.getElementById("scon").onclick=()=>{ st.clientId=document.getElementById("sid").value.trim(); st.clientSecret=document.getElementById("ssec").value.trim(); save(); stravaConnect(); }; }
async function shareFile(name,data,mime,title){
 if(CAP&&CAP.Plugins&&CAP.Plugins.Filesystem&&CAP.Plugins.Share){ try{ const r=await CAP.Plugins.Filesystem.writeFile({path:name,data,directory:"CACHE",encoding:"utf8"}); await CAP.Plugins.Share.share({title,url:r.uri,dialogTitle:title}); return; }catch(e){ if(String(e&&e.message).match(/cancel/i)) return; toast("Não foi possível compartilhar: "+esc(e&&e.message||e)); return; } }
 try{ const file=new File([data],name,{type:mime}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
 const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast("Arquivo salvo em Downloads"); }
async function exportBackup(){ const name="meutreino-backup-"+todayISO()+".json", data=JSON.stringify(load());
 if(NW&&NW.saveBackup){ try{ await NW.saveBackup({name,data}); toast("Cópia salva em Downloads/MeuTreino"); }catch(e){} }
 shareFile(name,data,"application/json","Backup Meu Treino"); }
function exportCSV(){ const s=load(), q=v=>{ const t=String(v==null?"":v); return /[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; }, n=v=>v==null?"":String(v).replace(".",",");
 const rows=[["data","treino","fase","minutos","lombar_0a10","exercicio","grupo","serie","kg","reps","rir","volume","recorde"]];
 s.sessions.forEach(x=>{ const c={}; x.sets.forEach(st=>{ c[st.ex]=(c[st.ex]||0)+1; rows.push([localISO(x.date),x.key,x.phase,x.min,x.pain,st.ex,muscleOf(st.ex)||"",c[st.ex],n(st.kg),st.reps,st.rir,n(Math.round(st.kg*st.reps*10)/10),st.pr?"sim":""]); }); });
 rows.push([]); rows.push(["MEDIÇÕES"]); rows.push(["data",...BODY.map(([k,l,u])=>l+" ("+u+")")]);
 [...s.body].sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>rows.push([x.date,...BODY.map(([k])=>n(x[k]))]));
 shareFile("meutreino-"+todayISO()+".csv","\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n"),"text/csv","Planilha Meu Treino"); }
