name: Build APK e publicar PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar dependências
        run: npm install
      - name: Gerar projeto Android
        run: |
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android
      - name: Ícone do app
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0d0f12' --splashBackgroundColor '#0d0f12'
      - name: Chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          VC=${{ github.run_number }} ./gradlew assembleDebug --no-daemon
      - name: Conferir assinatura (precisa ser sempre a mesma)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/cert.txt
          grep -qi "4e407a58cd741b604c1c3b0fa66f577375e0279b0a3ba41df83fb31171aa2271" /tmp/cert.txt
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MeuTreino.apk
      - uses: actions/upload-artifact@v4
        with: { name: MeuTreino-apk, path: MeuTreino.apk }


  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar app do relógio (Connect IQ)
        run: |
          docker run --rm -v "$PWD":/app -w /app/watch --entrypoint /bin/bash ghcr.io/matco/connectiq-tester:latest -c '
            set -e
            monkeyc --version || true
            for d in fr245m fr245; do
              monkeyc -f monkey.jungle -d $d -o /app/MeuTreino-$d.prg -y /app/ci/garmin_dev_key.der -r -w -l 0
            done
            monkeyc -f monkey.jungle -e -o /app/MeuTreino.iq -y /app/ci/garmin_dev_key.der -r -l 0
          '
          ls -la MeuTreino*
      - name: Capturas no simulador (demonstração)
        continue-on-error: true
        timeout-minutes: 6
        run: docker run --rm -v "$PWD":/app --entrypoint /bin/bash ghcr.io/matco/connectiq-tester:latest /app/ci/watch_sim.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: watch-shots, path: shots }
      - name: Publicar capturas no branch watch-shots
        continue-on-error: true
        run: |
          sudo chown -R "$(id -u)" shots
          cd shots && git init -q && git checkout -q -b watch-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "capturas ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" watch-shots
      - uses: actions/upload-artifact@v4
        with:
          name: MeuTreino-watch
          path: |
            MeuTreino-fr245m.prg
            MeuTreino-fr245.prg
            MeuTreino.iq

  release:
    needs: [apk, watch]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "MeuTreino-*", merge-multiple: true }
      - run: ls -la dist
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Meu Treino build ${{ github.run_number }}
          files: dist/*

  pages:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
